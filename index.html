<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barb Butterfly</title>

<!-- Fuentes -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  background: linear-gradient(-45deg, #ffd6f6, #fce1ff, #e6d0ff, #ffeefc);
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
  overflow-x: hidden;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

h1, h2 {
  font-family: 'Cinzel Decorative', serif;
  text-shadow: 0 0 10px #ffb6ff;
}

.container {
  width: 90%;
  max-width: 1000px;
  margin: 40px auto;
  padding: 30px;
  border-radius: 25px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(15px);
  box-shadow: 0 0 40px rgba(255,182,255,0.4);
}

button {
  background: linear-gradient(135deg,#ffd6f6,#e6d0ff);
  border: none;
  padding: 10px 20px;
  border-radius: 30px;
  cursor: pointer;
  font-family: 'Cinzel Decorative', serif;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 20px #ffb6ff;
}

.card {
  background: white;
  padding: 15px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.petalo {
  position: fixed;
  top: -10px;
  font-size: 20px;
  animation: caer linear infinite;
}

@keyframes caer {
  0% { transform: translateY(0); opacity:1; }
  100% { transform: translateY(100vh); opacity:0; }
}

.cursor-star {
  position: absolute;
  pointer-events:none;
  font-size:14px;
  color:white;
  text-shadow:0 0 6px #ffb6ff;
  animation: fadeStar 0.8s forwards;
}

@keyframes fadeStar {
  from {opacity:1; transform:scale(1);}
  to {opacity:0; transform:scale(2);}
}

</style>
</head>

<body>

<div class="container">

<h1>Barb Butterfly</h1>
<p>Bienvenida al espacio de las hijas ✨</p>

<img src="caricatura.png" style="width:150px;border-radius:50%;box-shadow:0 0 15px #ffc0ff;">

<br><br>

<a href="prayer.html">
<button>🌸 Prayer Garden</button>
</a>

<button id="musicBtn">🎵 Activar música</button>
<audio id="bgMusic" src="music.mp3" loop></audio>

<h2>🛍 Tienda</h2>

<div class="card">
<h3>Devocional “Raíces Firmes”</h3>
<p>Crecer profundamente en la Palabra 🌷</p>
<a href="https://TULINKDESYSTEMEIO.com" target="_blank">
<button>Comprar</button>
</a>
</div>

<h2>🌷 Galería</h2>

<div class="card">
<input type="file" id="uploadImg" accept="image/*">
<div id="gallery"></div>
</div>

<h2>💌 Libro de Mensajes</h2>

<div class="card">
<input type="text" id="chatInput" placeholder="Escribe un mensaje..." style="width:100%;padding:5px;">
<button onclick="enviarMensaje()">Enviar</button>
<div id="chatBox"></div>
</div>

</div>

<script>

// 🎵 Música
const btn = document.getElementById("musicBtn");
const music = document.getElementById("bgMusic");

btn.addEventListener("click", function(){
  if(music.paused){
    music.volume = 0.4;
    music.play().catch(()=>{});
    btn.innerText = "🌙 Música activada";
  } else {
    music.pause();
    btn.innerText = "🎵 Activar música";
  }
});

// 🌸 Pétalos
function crearPetalo(){
  let petalo=document.createElement("div");
  petalo.classList.add("petalo");
  petalo.innerHTML="🌸";
  petalo.style.left=Math.random()*window.innerWidth+"px";
  petalo.style.animationDuration=(Math.random()*3+3)+"s";
  document.body.appendChild(petalo);
  setTimeout(()=>{petalo.remove();},6000);
}
setInterval(crearPetalo,800);

// ✨ Estrellitas cursor
document.addEventListener("mousemove",function(e){
  let star=document.createElement("div");
  star.className="cursor-star";
  star.innerHTML="✦";
  star.style.left=e.pageX+"px";
  star.style.top=e.pageY+"px";
  document.body.appendChild(star);
  setTimeout(()=>{star.remove();},800);
});

// 📸 Galería
document.getElementById("uploadImg").addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=document.createElement("img");
    img.src=ev.target.result;
    img.style.width="100%";
    img.style.marginTop="10px";
    img.style.borderRadius="15px";
    img.style.boxShadow="0 0 10px #ffc0ff";
    document.getElementById("gallery").appendChild(img);
  };
  reader.readAsDataURL(file);
});

// 💌 Chat
function enviarMensaje(){
  const input=document.getElementById("chatInput");
  if(input.value.trim()==="")return;

  const chatBox=document.getElementById("chatBox");
  const msg=document.createElement("p");
  msg.textContent="🌸 "+input.value;
  msg.style.background="#fff0f5";
  msg.style.padding="5px";
  msg.style.borderRadius="10px";
  msg.style.margin="5px 0";

  chatBox.appendChild(msg);

  let mensajes=JSON.parse(localStorage.getItem("mensajes"))||[];
  mensajes.push(input.value);
  localStorage.setItem("mensajes",JSON.stringify(mensajes));

  input.value="";
}

// cargar mensajes
window.onload=function(){
  let mensajes=JSON.parse(localStorage.getItem("mensajes"))||[];
  const chatBox=document.getElementById("chatBox");
  mensajes.forEach(texto=>{
    const msg=document.createElement("p");
    msg.textContent="🌸 "+texto;
    msg.style.background="#fff0f5";
    msg.style.padding="5px";
    msg.style.borderRadius="10px";
    msg.style.margin="5px 0";
    chatBox.appendChild(msg);
  });
};

</script>

</body>
</html>
