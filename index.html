<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barb Butterfly</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cormorant Garamond', serif;
  background: linear-gradient(-45deg, #ffd6f6, #fce1ff, #e6d0ff, #ffeefc);
  background-size:400% 400%;
  animation:gradientMove 15s ease infinite;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.main-table{
  width:95%;
  max-width:900px;
  margin:30px auto;
  background:#fff8ee;
  border:5px double #bcd39b;
}

.banner{
  height:220px;
  background:linear-gradient(45deg,#ffd6ec,#e6ffe6);
  border:4px double #f4b8cd;
  text-align:center;
  color:#ff69b4;
}

.banner h1{
  padding-top:60px;
  font-family:'Cinzel Decorative', serif;
}

.box{
  background:#f8dce6;
  border:3px solid #bcd39b;
  padding:10px;
}

.menu-button{
  background:#dce9c8;
  border:2px solid #f4b8cd;
  padding:6px;
  display:block;
  text-align:center;
  text-decoration:none;
  color:#6a5d6d;
  font-weight:bold;
}

/* 🌸 RADIO Y2K */
#radioY2K{
  position:fixed;
  bottom:20px;
  right:20px;
  width:280px;
  background:linear-gradient(135deg,#ffd6f6,#e6d0ff);
  border:3px double #f4b8cd;
  border-radius:15px;
  box-shadow:0 0 20px #ffc0ff;
  z-index:99999;
  font-family:'Cinzel Decorative', serif;
  overflow:hidden;
  transition:0.3s;
}

.radio-header{
  background:#fff0f5;
  padding:8px;
  font-size:14px;
  border-bottom:2px solid #f4b8cd;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.radio-controls{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:8px;
}

.radio-btn{
  background:#ffccf9;
  border:2px solid #f4b8cd;
  border-radius:20px;
  padding:5px 10px;
  cursor:pointer;
  font-weight:bold;
}

#player{
  display:none;
}

#radioMinimized{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ffccf9;
  border:2px solid #f4b8cd;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
  display:none;
  z-index:99999;
}
</style>
</head>

<body>

<table class="main-table" cellspacing="10">
<tr>
<td colspan="3">
<div class="banner">
<h1>Barb Butterfly</h1>
<p>Bienvenida al espacio de las hijas</p>
</div>
</td>
</tr>

<tr>
<td width="200" class="box">
<h3>Perfil</h3>
<p>Nombre: Barbara</p>
<p>Alias: Hija amada de Dios ✨</p>
</td>

<td class="box">
<h2>💌 Libro de Mensajes</h2>
<input type="text" id="chatInput" placeholder="Escribe un mensaje..." style="width:100%;padding:5px;">
<button onclick="enviarMensaje()">Enviar</button>
<div id="chatBox"></div>
</td>

<td width="200" class="box">
<a href="prayer.html" class="menu-button">Prayer Garden</a>
</td>
</tr>
</table>

<!-- 🌸 RADIO -->
<div id="radioY2K">
  <div class="radio-header">
    ✨ Celestial Radio ✨
    <span onclick="minimizarRadio()" style="cursor:pointer;">—</span>
  </div>

  <div class="radio-controls">
    <button class="radio-btn" onclick="playRadio()">▶ Play</button>
    <button class="radio-btn" onclick="pauseRadio()">⏸ Pause</button>
  </div>

  <div id="player"></div>
</div>

<div id="radioMinimized" onclick="abrirRadio()">
🎵 Abrir Radio
</div>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

function onYouTubeIframeAPIReady(){
  player = new YT.Player('player',{
    height:'0',
    width:'0',
    playerVars:{
      listType:'playlist',
      list:'PLugEmV0ZKCqwuBmcOA_bdem8IZ8Jl5IXa',
      autoplay:0,
      controls:0,
      modestbranding:1,
      rel:0
    }
  });
}

function playRadio(){
  if(player) player.playVideo();
}

function pauseRadio(){
  if(player) player.pauseVideo();
}

function minimizarRadio(){
  document.getElementById("radioY2K").style.display="none";
  document.getElementById("radioMinimized").style.display="block";
}

function abrirRadio(){
  document.getElementById("radioY2K").style.display="block";
  document.getElementById("radioMinimized").style.display="none";
}

/* Firebase */
const firebaseConfig={
  apiKey:"AIzaSyC_Gmim74xpwpBqdHkgZvwUJdhXLyvsfw0",
  authDomain:"barbbutterfly-bc9a6.firebaseapp.com",
  projectId:"barbbutterfly-bc9a6"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function enviarMensaje(){
  const input=document.getElementById("chatInput");
  if(input.value.trim()==="") return;

  db.collection("mensajes").add({
    texto:input.value,
    fecha:firebase.firestore.FieldValue.serverTimestamp()
  });

  input.value="";
}

db.collection("mensajes")
.orderBy("fecha")
.onSnapshot((snapshot)=>{
  const chatBox=document.getElementById("chatBox");
  chatBox.innerHTML="";
  snapshot.forEach((doc)=>{
    const p=document.createElement("p");
    p.textContent=doc.data().texto;
    chatBox.appendChild(p);
  });
});
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</body>
  </html>
