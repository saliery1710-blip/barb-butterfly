<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barb Butterfly</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cormorant Garamond', serif;
  background: linear-gradient(-45deg,#ffd6f6,#fce1ff,#e6d0ff,#ffeefc);
  background-size:400% 400%;
  animation:gradientMove 15s ease infinite;
}
@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* EFECTOS */
#particles-js{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:0;
  pointer-events:none;
}

.flores{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
}

.main-table{
  position:relative;
  z-index:5;
}

.flor{
  position:absolute;
  top:-50px;
  animation:caer linear infinite;
  opacity:0.8;
}

@keyframes caer{
  0%{transform:translateY(0) rotate(0deg);}
  100%{transform:translateY(110vh) rotate(360deg);}
}

h1{
  font-family:'Cinzel Decorative',serif;
  letter-spacing:3px;
  text-shadow:0 0 10px #ffb6ff;
}

.main-table{
  width:95%;
  max-width:900px;
  margin:30px auto;
  background:#fff8ee;
  border:5px double #bcd39b;
}

.banner{
  height:220px;
  background:linear-gradient(45deg,#ffd6ec,#e6ffe6);
  border:4px double #f4b8cd;
  text-align:center;
  color:#ff69b4;
}
.banner h1{padding-top:60px;font-size:36px;}

.box{
  background:#f8dce6;
  border:3px solid #bcd39b;
  padding:10px;
}

.tienda-card{
  background:white;
  padding:15px;
  margin:10px 0;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  text-align:center;
}

.menu-button{
  background:#dce9c8;
  border:2px solid #f4b8cd;
  padding:6px;
  margin:5px 0;
  display:block;
  text-align:center;
  text-decoration:none;
  color:#6a5d6d;
  font-weight:bold;
}

.mensaje-card{
  background:#fff0f5;
  padding:8px;
  margin:6px 0;
  border-radius:10px;
}

/* RADIO */
#radioY2K{
  position:fixed;
  bottom:20px;
  right:20px;
  width:280px;
  background:linear-gradient(135deg,#ffd6f6,#e6d0ff);
  border:3px double #f4b8cd;
  border-radius:15px;
  box-shadow:0 0 20px #ffc0ff;
  z-index:9999;
  overflow:hidden;
}
.radio-header{
  background:#fff0f5;
  padding:8px;
  display:flex;
  justify-content:space-between;
}
#player{height:180px;}
  /* BOTÓN FLOTANTE RADIO */
#radioButton{
  position:fixed;
  bottom:25px;
  right:25px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffd6f6,#e6d0ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 0 20px #ffc0ff;
  z-index:9999;
  transition:transform 0.3s ease;
}

#radioButton:hover{
  transform:scale(1.1);
}
</style>
</head>

<body>

<div id="particles-js"></div>
<div class="flores"></div>

<table class="main-table" cellspacing="10">
<tr>
<td colspan="3">
<div class="banner">
<h1>Barb Butterfly</h1>
<p>Bienvenida al espacio de las hijas</p>
</div>
</td>
</tr>

<tr>

<td width="200" class="box">
<h3>Perfil</h3>
<p><strong>Nombre:</strong> Barbara</p>
<p><strong>Alias:</strong> Hija amada de Dios</p>
<img src="caricatura.png" width="120">
</td>

<td class="box">

<h2>🛍 Tienda</h2>
<div class="tienda-card">
<h3>Devocional “Raíces Firmes”</h3>
<a href="https://TULINKDESYSTEMEIO.com" target="_blank">
<button>Comprar</button>
</a>
</div>

<h2>📖 Libro de Mensajes</h2>

<div style="margin-bottom:15px;">
  <input type="text" id="nombre" placeholder="Tu nombre" style="width:100%;padding:8px;margin-bottom:6px;border-radius:8px;border:1px solid #ccc;">
  
  <textarea id="texto" placeholder="Escribe tu mensaje..." 
  style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;"></textarea>
  
  <button onclick="enviarMensaje()" 
  style="margin-top:8px;padding:8px 15px;border:none;border-radius:10px;background:#dce9c8;font-weight:bold;">
  Enviar ✨
  </button>
</div>

<div id="mensajes"></div>

<h2>🌷 Galería Celestial</h2>
<div id="gallery" style="
display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
gap:10px;"></div>
<h2>💖 Testimonios</h2>

<div style="margin-bottom:15px;">
  <input type="text" id="nombreTestimonio" placeholder="Tu nombre"
  style="width:100%;padding:8px;margin-bottom:6px;border-radius:8px;border:1px solid #ccc;">

  <textarea id="textoTestimonio" placeholder="Escribe tu testimonio..."
  style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;"></textarea>

  <button onclick="enviarTestimonio()"
  style="margin-top:8px;padding:8px 15px;border:none;border-radius:10px;background:#ffd6ec;font-weight:bold;">
  Enviar Testimonio ✨
  </button>
</div>

<div id="testimonios"></div>
</td>

<td width="200" class="box">
<a href="prayer.html" class="menu-button">Prayer Garden</a>
</td>

</tr>
</table>

<!-- RADIO -->
<!-- BOTÓN FLOTANTE -->
<div id="radioButton" onclick="toggleRadio()">
  🎵
</div>

<!-- RADIO PANEL -->
<div id="radioY2K" style="display:none;">
  <div class="radio-header">
    ✨ Celestial Radio
    <span onclick="toggleRadio()">✖</span>
  </div>
  <div id="player"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
function onYouTubeIframeAPIReady(){
  new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:'PLugEmV0ZKCqwuBmcOA_bdem8IZ8Jl5IXa',
      controls:1
    }
  });
</script>
  <script>
function toggleRadio(){
  const radio = document.getElementById("radioY2K");
  if(radio.style.display === "none"){
    radio.style.display = "block";
  } else {
    radio.style.display = "none";
  }
}
</script>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 50 },
    size: { value: 3 },
    move: { speed: 0.6 },
    opacity: { value: 0.5 },
    line_linked: { enable: false }
  }
});

/* FLORES */
const floresContainer = document.querySelector(".flores");

function crearFlor(){
  const flor = document.createElement("div");
  flor.classList.add("flor");
  flor.innerHTML = ["🌸","🌷","🦋","🩷","⭐️"][Math.floor(Math.random()*3)];
  flor.style.left = Math.random()*100 + "vw";
  flor.style.animationDuration = (6 + Math.random()*6) + "s";
  flor.style.fontSize = (15 + Math.random()*20) + "px";
  floresContainer.appendChild(flor);

  setTimeout(()=>{flor.remove();},12000);
}

setInterval(crearFlor,900);
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
  apiKey:"AIzaSyC_Gmim74xpwpBqdHkgZvwUJdhXLyvsfw0",
  authDomain:"barbbutterfly-bc9a6.firebaseapp.com",
  projectId:"barbbutterfly-bc9a6"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* MENSAJES */
function enviarMensaje(){
  const nombre = document.getElementById("nombre").value;
  const texto = document.getElementById("texto").value;

  if(nombre === "" || texto === ""){
    alert("Completa ambos campos 💕");
    return;
  }

  db.collection("mensajes").add({
    nombre: nombre,
    texto: texto,
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("nombre").value="";
  document.getElementById("texto").value="";
}

db.collection("mensajes").orderBy("fecha")
.onSnapshot((snapshot)=>{
  const cont=document.getElementById("mensajes");
  cont.innerHTML="";
  snapshot.forEach((doc)=>{
    const data=doc.data();
    const div=document.createElement("div");
    div.className="mensaje-card";
    div.innerHTML=`<strong>${data.nombre}</strong><br>${data.texto}`;
    cont.appendChild(div);
  });
});

/* TESTIMONIOS */
function enviarTestimonio(){
  const nombre = document.getElementById("nombreTestimonio").value;
  const texto = document.getElementById("textoTestimonio").value;

  if(nombre === "" || texto === ""){
    alert("Completa ambos campos 💕");
    return;
  }

  db.collection("testimonios").add({
    nombre: nombre,
    texto: texto,
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("nombreTestimonio").value="";
  document.getElementById("textoTestimonio").value="";
}

db.collection("testimonios").orderBy("fecha")
.onSnapshot((snapshot)=>{
  const cont=document.getElementById("testimonios");
  cont.innerHTML="";
  snapshot.forEach((doc)=>{
    const data=doc.data();
    const div=document.createElement("div");
    div.className="mensaje-card";
    div.innerHTML=`<strong>${data.nombre}</strong><br>${data.texto}`;
    cont.appendChild(div);
  });
});

/* GALERÍA */
db.collection("galeria").onSnapshot((snapshot)=>{
  const gallery=document.getElementById("gallery");
  gallery.innerHTML="";
  snapshot.forEach((doc)=>{
    const data=doc.data();
    const img=document.createElement("img");
    img.src=data.imagenUrl;
    img.style.width="100%";
    img.style.borderRadius="12px";
    gallery.appendChild(img);
  });
  
</script>

</body>
</html>
