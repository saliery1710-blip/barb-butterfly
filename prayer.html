<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barb Butterfly</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  background: linear-gradient(#ffe6f5, #e6f0ff);
  color: #6a5d6d;
  text-align: center;
}

.container {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  gap: 10px;
  width: 90%;
  max-width: 1000px;
  margin: 40px auto;
  border: 2px solid #e6d6f0;
  padding: 20px;
  background: #ffe6f5;
  border-radius: 15px;
}

h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 36px;
  text-shadow: 0 0 10px #ffb6ff, 0 0 20px #ffd6f6;
  margin-bottom: 10px;
}

/* Galería Celestial */
#celestialGallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 10px;
}

#celestialGallery img {
  width: 120px;
  margin: 5px;
  border-radius: 10px;
  border: 2px solid #f4b8cd;
}

/* Inputs y botones */
input, textarea, button {
  padding: 8px;
  margin: 5px 0;
  border-radius: 10px;
  border: 2px solid #d8b4ff;
  font-family: inherit;
}

button {
  background: #ffccf9;
  cursor: pointer;
}

.profile img {
  width: 100px;
  border-radius: 50%;
  border: 2px solid #f4b8cd;
}
</style>
</head>

<body>

<h1>BARB BUTTERFLY</h1>
<p>Bienvenida al espacio de las hijas</p>

<div class="container">
  <!-- Perfil -->
  <div class="profile">
    <p><strong>Nombre:</strong> Barbara</p>
    <p><strong>Alias:</strong> Hija amada de Dios ✨</p>
    <img src="perfil.jpg" alt="Perfil">
  </div>

  <!-- Centro: Tienda, Galería, Libro de Mensajes -->
  <div>
    <!-- Tienda -->
    <div>
      <h2>🎁 Tienda</h2>
      <div style="background:#fff; padding:10px; margin:5px; border-radius:10px;">
        <p><strong>Devocional “Raíces Firmes”</strong></p>
        <p>Crecer profundamente en la Palabra 🌹</p>
        <button>Comprar Raíces Firmes</button>
      </div>
      <div style="background:#fff; padding:10px; margin:5px; border-radius:10px;">
        <p>✨ Stickers Cristianos ✨</p>
        <p>Arte con propósito 🎀</p>
        <button disabled>Coming Soon</button>
      </div>
    </div>

    <!-- Galería Celestial -->
    <div>
      <h2>🌹 Galería Celestial</h2>
      <input type="file" id="uploadImage">
      <div id="celestialGallery"></div>
    </div>

    <!-- Libro de Mensajes -->
    <div>
      <h2>💌 Libro de Mensajes</h2>
      <input type="text" id="mensajeInput" placeholder="Escribe un mensaje...">
      <button onclick="enviarMensaje()">Enviar</button>
      <div id="mensajeBox" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- Botón Prayer Garden -->
  <div>
    <button onclick="location.href='prayergarden.html'">Prayer Garden</button>
  </div>
</div>

<!-- 🔥 Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<script>
// 🔹 Config Firebase
const firebaseConfig = {
  apiKey: "AIzaSyC_Gmim74xpwpBqdHkgZvwUJdhXLyvsfw0",
  authDomain: "barbbutterfly-bc9a6.firebaseapp.com",
  projectId: "barbbutterfly-bc9a6",
  storageBucket: "barbbutterfly-bc9a6.firebasestorage.app",
  messagingSenderId: "1015786068141",
  appId: "1:1015786068141:web:e6b7b3e5966fad547c8e24"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

// 📷 Subida de imágenes (pendiente)
document.getElementById('uploadImage').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;

  const storageRef = storage.ref('pending/' + file.name);
  await storageRef.put(file);
  alert("Imagen subida y pendiente de moderación");
});

// 🌟 Cargar galería aprobada
function loadGallery() {
  const galleryDiv = document.getElementById('celestialGallery');
  const approvedRef = storage.ref('approved/');
  approvedRef.listAll().then(res=>{
    galleryDiv.innerHTML = "";
    res.items.forEach(itemRef=>{
      itemRef.getDownloadURL().then(url=>{
        const img = document.createElement('img');
        img.src = url;
        galleryDiv.appendChild(img);
      });
    });
  });
}
window.onload = loadGallery;

// 💌 Libro de mensajes
function enviarMensaje() {
  const texto = document.getElementById('mensajeInput').value.trim();
  if(!texto) return;

  db.collection('mensajes').add({
    texto: texto,
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  });
  document.getElementById('mensajeInput').value = "";
}

db.collection('mensajes').orderBy('fecha').onSnapshot(snapshot=>{
  const box = document.getElementById('mensajeBox');
  box.innerHTML = "";
  snapshot.forEach(doc=>{
    const data = doc.data();
    const div = document.createElement('div');
    div.textContent = data.texto;
    box.appendChild(div);
  });
});
</script>

<!-- 🎵 Música continua -->
<audio id="bg-music" src="music.mp3" loop autoplay></audio>

</body>
</html>
