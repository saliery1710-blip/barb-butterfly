<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Garden</title>

<style>
body{
  margin:0;
  font-family:'Cormorant Garamond', serif;
  background: linear-gradient(#ffe6f5, #e6f0ff);
  color:#6a5d6d;
}

.container{
  width:90%;
  max-width:800px;
  margin:60px auto;
  background:#fff8ee;
  border:5px double #f4b8cd;
  padding:30px;
  text-align:center;
  border-radius:20px;
}

input, textarea{
  width:90%;
  padding:10px;
  margin:10px 0;
  border:2px solid #d8b4ff;
  border-radius:10px;
}

button{
  background:#ffccf9;
  border:2px solid #f4b8cd;
  padding:8px 15px;
  border-radius:15px;
  cursor:pointer;
  margin-top:5px;
}

.prayer-card{
  background:#fff0f5;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌸 Prayer Garden ✨</h1>

<form onsubmit="event.preventDefault(); enviarOracion();">
<input type="text" id="nombreInput" placeholder="Tu nombre (opcional)">
<textarea id="prayerInput" placeholder="Escribí tu pedido..." required></textarea>
<button type="submit">Enviar oración</button>
</form>

<div id="prayerBox"></div>

<a href="index.html">⬅ Volver al Portal</a>

</div>

<audio id="ching-sound" src="ching.mp3" preload="auto"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
  apiKey:"AIzaSyC_Gmim74xpwpBqdHkgZvwUJdhXLyvsfw0",
  authDomain:"barbbutterfly-bc9a6.firebaseapp.com",
  projectId:"barbbutterfly-bc9a6"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* 🌿 Enviar oración */
function enviarOracion(){
  const nombre=document.getElementById("nombreInput").value.trim();
  const texto=document.getElementById("prayerInput").value.trim();
  if(!texto) return;

  db.collection("oraciones").add({
    nombre:nombre || "Anónimo",
    texto:texto,
    fecha:firebase.firestore.FieldValue.serverTimestamp(),
    amen:0
  }).then(()=>{
    document.getElementById("ching-sound").play();
    alert("✨ Tu oración ha sido elevada al Cielo ✨");
    document.getElementById("prayerInput").value="";
  });
}

/* 🌿 Mostrar oraciones */
db.collection("oraciones")
.orderBy("fecha")
.onSnapshot((snapshot)=>{
  const box=document.getElementById("prayerBox");
  box.innerHTML="";
  snapshot.forEach((doc)=>{
    const data=doc.data();
    const div=document.createElement("div");
    div.className="prayer-card";
    div.innerHTML=`
      <strong>🌸 ${data.nombre}</strong><br>
      ${data.texto}<br>
      <button onclick="darAmen('${doc.id}')">
        Amén (${data.amen || 0})
      </button>
    `;
    box.appendChild(div);
  });
});

/* 🌿 Botón Amén */
function darAmen(id){
  db.collection("oraciones").doc(id).update({
    amen:firebase.firestore.FieldValue.increment(1)
  });
}
</script>

</body>
</html>
