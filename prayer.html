<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Garden</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Cormorant Garamond', serif;
  background: linear-gradient(#ffe6f5, #e6f0ff);
  color:#6a5d6d;
}

.container{
  width:90%;
  max-width:800px;
  margin:60px auto;
  background:#fff8ee;
  border:5px double #f4b8cd;
  padding:30px;
  text-align:center;
  border-radius:20px;
}

input, textarea{
  width:90%;
  padding:10px;
  margin:10px 0;
  border:2px solid #d8b4ff;
  border-radius:10px;
}

button{
  background:#ffccf9;
  border:2px solid #f4b8cd;
  padding:10px 20px;
  border-radius:15px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🌸 Prayer Garden ✨</h1>

<form onsubmit="event.preventDefault(); enviarOracion();">

<input type="text" id="nombreInput" placeholder="Tu nombre (opcional)">
<textarea id="prayerInput" placeholder="Escribí tu pedido..." required></textarea>
<button type="submit">Enviar oración</button>

</form>

<div id="prayerBox" style="margin-top:20px;text-align:left;"></div>

<a href="index.html">⬅ Volver al Portal</a>

</div>

<!-- 🔔 Sonidos -->
<audio id="bg-music" src="music.mp3" loop></audio>
<audio id="ching-sound" src="ching.mp3" preload="auto"></audio>

<!-- 🔥 Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "TU_APIKEY",
  authDomain: "barbbutterfly-bc9a6.firebaseapp.com",
  projectId: "barbbutterfly-bc9a6",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* 🎵 Música persistente */
const music = document.getElementById("bg-music");

if(localStorage.getItem("musicPlaying")==="true"){
  music.play();
}

document.addEventListener("click",()=>{
  music.play();
},{once:true});

music.addEventListener("play",()=>{
  localStorage.setItem("musicPlaying","true");
});

/* 🌿 Enviar oración */
function enviarOracion(){
  const nombre = document.getElementById("nombreInput").value.trim();
  const texto = document.getElementById("prayerInput").value.trim();
  if(!texto) return;

  db.collection("oraciones").add({
    nombre: nombre || "Anónimo",
    texto: texto,
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    document.getElementById("ching-sound").play();
    document.getElementById("prayerInput").value="";
  });
}

/* 🌿 Mostrar oraciones */
db.collection("oraciones")
.orderBy("fecha")
.onSnapshot((snapshot)=>{
  const box=document.getElementById("prayerBox");
  box.innerHTML="";
  snapshot.forEach((doc)=>{
    const data=doc.data();
    const div=document.createElement("div");
    div.style.background="#fff0f5";
    div.style.padding="10px";
    div.style.margin="8px 0";
    div.style.borderRadius="10px";
    div.innerHTML=`<strong>🌸 ${data.nombre}</strong><br>${data.texto}`;
    box.appendChild(div);
  });
});
</script>

</body>
</html>
